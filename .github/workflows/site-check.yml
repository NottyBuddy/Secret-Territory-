name: Secret Territory quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check HTML, accessibility and security invariants
        run: python scripts/check_site.py
      - name: Parse inline JavaScript and config builder
        run: |
          node --check /tmp/secret-territory-inline.js
          node --check scripts/build-config.js
